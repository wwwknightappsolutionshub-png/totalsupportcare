# Drop into your HTTPS server / location blocks (API + static SPA).
# Hides reverse-proxy fingerprints and blocks secret/path probes.

server_tokens off;
more_clear_headers Server;
more_clear_headers X-Powered-By;

# If headers-more-nginx-module is unavailable, at least:
#   server_tokens off;
# and avoid revealing versions in error pages / custom Server headers.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

# Deny probes for secrets, VCS, and dependency manifests
location ~* /(^|/)\.env {
  return 404;
}
location ~* /(^|/)secrets(/|$) {
  return 404;
}
location ~* /\.git {
  return 404;
}
location ~* \.(pem|key|p12|pfx|crt|cer)$ {
  return 404;
}
location ~* /(package(-lock)?\.json|composer\.(json|lock)|yarn\.lock|pnpm-lock\.yaml)$ {
  return 404;
}
location ~* /(Dockerfile|docker-compose.*\.(yml|yaml)|web\.config|\.htaccess)$ {
  return 404;
}

# Never map document roots at the API project root (keep uploads via /uploads only).
# Example SPA root should be the Vite dist/ folder only.
